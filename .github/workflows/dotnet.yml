name: .NET

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GestionEventos.csproj
      - name: Build
        run: dotnet build GestionEventos.csproj --no-restore
      - name: Test
        run: dotnet test tests/GestionEventos.Tests/GestionEventos.Tests.csproj
